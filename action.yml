name: 'Lerna package name'
description: 'This action labels PRs in a lerna monorepo with the package names they affect'
inputs:
  github-token:
    description: 'Token for the repository. Can be passed in using {{ secrets.GITHUB_TOKEN }}'
    required: true
  path:
    description: 'Working directory to run in, relative to the checkout root. Set this when the lerna workspace lives in a subdirectory of the repository. Defaults to the checkout root.'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
author: 'ExodusMovement'
branding:
  icon: 'activity'
  color: 'gray-dark'
